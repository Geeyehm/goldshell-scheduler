# Example schedule config for goldshell-scheduler.
#
# Copy this to config.yaml and fill in real IPs/passwords, then run it via
# one of:
#   - a cron tick (recommended for quick setups):
#       */5 * * * * /usr/bin/python3 /path/to/scheduler.py -c /path/to/config.yaml >> /var/log/goldshell-scheduler.log 2>&1
#   - its own built-in loop, standalone:
#       python3 scheduler.py -c config.yaml --loop 60
#   - a systemd service (recommended for unattended/long-running use - see
#     the "systemd service" option in README.md for the unit file)
#
# Each device switches to whatever schedule entry is most recent (<= now),
# so schedules persist correctly across midnight without needing a 00:00 entry.

devices:
  - name: office
    ip: 192.168.1.100
    password: "your-admin-password"
    schedule:
      # applies every day unless "days" is set
      - time: "08:00"
        mode: hashrate
      - time: "22:00"
        mode: idle

  - name: garage
    ip: 192.168.1.101
    password: "your-admin-password"
    schedule:
      # weekdays: full power overnight (off-peak electricity), idle during the day
      - time: "23:00"
        mode: hashrate
        days: [mon, tue, wed, thu, fri]
      - time: "07:00"
        mode: idle
        days: [mon, tue, wed, thu, fri]
      # weekends: idle all day
      - time: "00:00"
        mode: idle
        days: [sat, sun]

      # advanced: target a specific power-plan level directly instead of a
      # named mode, if your device has more than the usual two plans
      # - time: "12:00"
      #   level: 3
